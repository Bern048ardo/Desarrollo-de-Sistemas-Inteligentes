
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/estilos.css">
</head>
<body>

    <div class="container-fluid">
        <div class="row">

            <!-- Menú lateral -->
            <div class="col-md-3 col-lg-2 sidebar p-3">

                <h4 class="text-white text-center">
                    Proyecto DSI
                </h4>

                <hr class="text-white">

                <a href="index.html">
                    Inicio
                </a>

                <a href="#" onclick="mostrarSeccion('usuarios'); return false;">
                    Usuarios
                </a>

                <a href="#" onclick="mostrarSeccion('reportes'); return false;">
                    Reportes
                </a>

                <a href="#" onclick="mostrarSeccion('configuracion'); return false;">
                    Configuración
                </a>

            </div>

            <!-- Contenido principal -->
            <div class="col-md-9 col-lg-10 p-0">

                <nav class="navbar bg-light border-bottom px-4">
                    <span class="navbar-brand">
                        Panel de Administración
                    </span>

                    <a href="../login.html" class="btn btn-danger">
                        Cerrar sesión
                    </a>
                </nav>

                <main class="p-4">

                    <h2 id="titulo">
                        Bienvenido, Administrador
                    </h2>

                    <p id="descripcion">
                        Selecciona una opción del menú.
                    </p>

                    <div class="row mt-4">

                        <div class="col-md-4 mb-3">
                            <div class="card">
                                <div class="card-body">
                                    <h5>Usuarios</h5>
                                    <p>Administración de usuarios.</p>
                                </div>
                            </div>
                        </div>

                        <div class="col-md-4 mb-3">
                            <div class="card">
                                <div class="card-body">
                                    <h5>Reportes</h5>
                                    <p>Consulta de reportes.</p>
                                </div>
                            </div>
                        </div>

                        <div class="col-md-4 mb-3">
                            <div class="card">
                                <div class="card-body">
                                    <h5>Configuración</h5>
                                    <p>Opciones del sistema.</p>
                                </div>
                            </div>
                        </div>

                    </div>

                </main>

            </div>

        </div>
    </div>

    <script src="../js/script.js"></script>

</body>
</html>
